name: FXCM EURUSD 2018 Sweep Posthoc

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/explore_failed_sweep_2018.py"
      - "src/confluence_lab/diagnostics.py"
      - "tests/test_diagnostics.py"
      - ".github/workflows/fxcm-2018-sweep-posthoc.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify research tests
        run: pytest

      - name: Run fixed failed-candidate diagnostics
        run: python scripts/explore_failed_sweep_2018.py --output benchmark-results/fxcm-eurusd-m1-2018-sweep-posthoc.json

      - name: Upload exploratory report
        uses: actions/upload-artifact@v4
        with:
          name: fxcm-eurusd-2018-sweep-posthoc
          path: benchmark-results/fxcm-eurusd-m1-2018-sweep-posthoc.json
          if-no-files-found: error
          retention-days: 30
