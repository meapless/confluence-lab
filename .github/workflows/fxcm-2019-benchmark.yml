name: FXCM EURUSD 2019 Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_fxcm_2019_benchmark.py"
      - ".github/workflows/fxcm-2019-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify research tests
        run: pytest

      - name: Run FXCM 2019 EURUSD benchmark
        run: python scripts/run_fxcm_2019_benchmark.py --output benchmark-results/fxcm-eurusd-m1-2019.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxcm-eurusd-2019-benchmark
          path: benchmark-results/fxcm-eurusd-m1-2019.json
          if-no-files-found: warn
          retention-days: 30
