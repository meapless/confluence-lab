name: Dukascopy EURUSD 2015 V5 Source Robustness

# Attempt 4. Attempts 1-3 produced no complete dataset or V5 trading metric:
# run 34567258684 ended on HTTP 503, run 34567563016 ended on a read timeout,
# and run 34568459430 exposed the non-canonical daily tick URL/epoch bug.
# Protocol Amendment 1 freezes the corrected canonical hourly BI5 acquisition
# path, hour-relative timestamps and transport-only batching before this run.
# The preregistered V5 model, threshold, expiry, payout scenario and evidence
# gates remain unchanged.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dukascopy-2015-v5-source-robustness.yml"

permissions:
  contents: read

jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify research tests before Dukascopy 2015 access
        run: pytest

      - name: Run preregistered frozen V5 Dukascopy source test
        run: >-
          python scripts/run_dukascopy_2015_v5_source_robustness.py
          --output benchmark-results/dukascopy-eurusd-m1-2015-v5-source-robustness.json

      - name: Upload source robustness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-eurusd-2015-v5-source-robustness
          path: benchmark-results/dukascopy-eurusd-m1-2015-v5-source-robustness.json
          if-no-files-found: error
          retention-days: 30
