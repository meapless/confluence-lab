[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-lab"
version = "0.5.0"
description = "Evidence-driven research engine for payout-aware short-horizon trading strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
confluence-search = "confluence_lab.cli:main"
confluence-matrix-search = "confluence_lab.matrix_cli:main"
confluence-fetch-fx = "confluence_lab.fx_cli:main"
confluence-pocket-capture = "confluence_lab.pocket_capture_cli:main"
confluence-pocket-consolidate = "confluence_lab.pocket_consolidate_cli:main"
confluence-pocket-watch = "confluence_lab.pocket_watch_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
