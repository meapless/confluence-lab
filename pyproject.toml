[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-lab"
version = "0.1.0"
description = "Evidence-driven research engine for payout-aware short-horizon trading strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
